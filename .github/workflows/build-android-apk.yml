name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/build-android-apk.yml
      - cmake/platform/android/android.cmake

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-arm64:
    name: Android arm64-v8a
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      ANDROID_NDK_VERSION: 28.2.13676358
      BUILD_HOST: aarch64-linux-android
      BUILD_JOBS: 2
      DROIDBUDDY3_ANDROID_KEY_ALIAS: androiddebugkey
      DROIDBUDDY3_ANDROID_KEY_PASSWORD: android
      DROIDBUDDY3_ANDROID_STORE_PASSWORD: android

    steps:
      - name: Check out DroidBuddy3
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          sdkmanager_bin="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${sdkmanager_bin}" --licenses >/dev/null || true
          "${sdkmanager_bin}" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint bison build-essential ccache curl \
            flex gawk gettext git gperf lib32stdc++6 lib32z1 lib32z1-dev \
            libcurl4-openssl-dev libltdl-dev libtool nasm unzip zip zlib1g-dev

      - name: Create Android signing key
        shell: bash
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/.android"
          keytool -genkeypair -noprompt \
            -keystore "${GITHUB_WORKSPACE}/.android/debug.keystore" \
            -alias "${DROIDBUDDY3_ANDROID_KEY_ALIAS}" \
            -storepass "${DROIDBUDDY3_ANDROID_STORE_PASSWORD}" \
            -keypass "${DROIDBUDDY3_ANDROID_KEY_PASSWORD}" \
            -dname "CN=DroidBuddy3 Debug,O=DroidBuddy3,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          echo "DROIDBUDDY3_ANDROID_STORE_FILE=${GITHUB_WORKSPACE}/.android/debug.keystore" >> "${GITHUB_ENV}"

      - name: Configure Android dependencies
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/droidbuddy3-tarballs" "${RUNNER_TEMP}/droidbuddy3-depends"
          cd tools/depends
          ./bootstrap
          ./configure \
            --with-tarballs="${RUNNER_TEMP}/droidbuddy3-tarballs" \
            --host="${BUILD_HOST}" \
            --with-sdk-path="${ANDROID_SDK_ROOT}" \
            --with-ndk-path="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" \
            --prefix="${RUNNER_TEMP}/droidbuddy3-depends" \
            --enable-debug=no

      - name: Build Android dependencies
        shell: bash
        run: make -C tools/depends -j"${BUILD_JOBS}"

      - name: Configure DroidBuddy3
        shell: bash
        run: |
          make -C tools/depends/target/cmakebuildsys \
            BUILD_DIR="${GITHUB_WORKSPACE}/build"

      - name: Build DroidBuddy3
        shell: bash
        run: cmake --build build --parallel "${BUILD_JOBS}"

      - name: Package APK
        shell: bash
        run: cmake --build build --target apk --parallel "${BUILD_JOBS}"

      - name: Collect APK
        id: package
        shell: bash
        run: |
          mkdir -p release
          apk_path="$(find build -type f -name '*.apk' ! -name '*unaligned*' -print -quit)"
          test -n "${apk_path}"
          cp "${apk_path}" release/DroidBuddy3-23.0-ALPHA1-arm64-v8a.apk
          sha256sum release/DroidBuddy3-23.0-ALPHA1-arm64-v8a.apk | tee release/DroidBuddy3-23.0-ALPHA1-arm64-v8a.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroidBuddy3-Android-arm64-v8a
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="droidbuddy3-23.0-alpha1"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" release/* --clobber
          else
            gh release create "${tag}" release/* \
              --target "${GITHUB_SHA}" \
              --title "DroidBuddy3 23.0 Alpha 1 (Android ARM64)" \
              --prerelease \
              --notes "Installable DroidBuddy3 test build for 64-bit ARM Android devices. Signed with a debug key; uninstall an older differently signed build before installing."
          fi
